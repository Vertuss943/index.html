<style>
:root{
  --pitch:#1B0607;
  --brand-red:#7F1A12;
  --paper:#F2ECE4;
  --paper-2:#EAE0D5;
  --ink:#180E0C;
  --accent:#FFFFFF;
  --live-red:#E2402C;
}
*{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }
body{
  margin:0;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--paper);
  color:var(--ink);
}
button{ font:inherit; color:inherit; background:none; border:none; padding:0; cursor:pointer; }
img{ display:block; max-width:100%; }
h1,h2,h3,h4,p{ margin:0; }
.font-display, .navbar__logo-foot, .navbar__logo-culture, .hero__title, .card__title,
.popular-row__title, .section__title, .category-header__title, .article-title,
.popular-row__rank{
  font-family:'Anton', Impact, 'Arial Narrow', sans-serif;
  font-weight:400;
}
::selection{ background:var(--accent); color:var(--pitch); }

.wrap{ max-width:1280px; margin:0 auto; padding:0 20px; }
@media (min-width:640px){ .wrap{ padding:0 32px; } }

/* ---------- NAVBAR ---------- */
.navbar{ position:sticky; top:0; z-index:50; background:linear-gradient(135deg, var(--brand-red) 0%, var(--pitch) 70%); transition:box-shadow .2s; }
.navbar--scrolled{ box-shadow:0 10px 30px rgba(0,0,0,0.25); }
.navbar__inner{ display:flex; align-items:center; justify-content:space-between; height:64px; }
.navbar__logo{ display:flex; align-items:center; gap:2px; }
.navbar__logo-mark{ width:32px; height:32px; margin-right:8px; align-self:center; border-radius:50%; }
.footer__logo-mark{ width:26px; height:26px; }
.navbar__logo-foot{ font-size:1.5rem; color:#fff; transform:skewX(-6deg); display:inline-block; }
.navbar__logo-culture{ font-size:1.5rem; color:var(--accent); transform:skewX(-6deg); display:inline-block; }
.navbar__nav{ display:none; align-items:center; gap:18px; }
@media (min-width:768px){ .navbar__nav{ display:flex; } }
@media (min-width:1100px){ .navbar__nav{ gap:26px; } }
.navbar__link{ position:relative; padding-bottom:4px; font-size:13px; font-weight:500; color:rgba(255,255,255,0.85); white-space:nowrap; }
@media (min-width:1100px){ .navbar__link{ font-size:14px; } }
.navbar__link:hover{ color:#fff; }
.navbar__link::after{ content:''; position:absolute; left:0; right:100%; bottom:-4px; height:2px; background:var(--accent); transition:right .25s ease; }
.navbar__link:hover::after, .navbar__link.active::after{ right:0; }
.navbar__link.active{ color:#fff; }
.navbar__right{ display:flex; align-items:center; gap:8px; }
.navbar__search-btn{ display:flex; align-items:center; justify-content:center; width:36px; height:36px; font-size:18px; color:#fff; border-radius:50%; }
.navbar__search-btn:hover{ background:rgba(255,255,255,0.1); }
.navbar__search-bar{ border-top:1px solid rgba(255,255,255,0.12); background:var(--pitch); padding:12px 0; }
.navbar__search-input{ width:100%; max-width:480px; padding:10px 14px; font-size:15px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); color:#fff; }
.navbar__search-input::placeholder{ color:rgba(255,255,255,0.5); }
.navbar__search-input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
.navbar__burger{ display:flex; flex-direction:column; justify-content:center; align-items:center; gap:6px; width:36px; height:36px; }
@media (min-width:768px){ .navbar__burger{ display:none; } }
.navbar__burger-line{ display:block; height:2px; width:24px; background:#fff; transition:transform .2s, opacity .2s; }
.navbar__burger-line.l1{ transform:translateY(8px) rotate(45deg); }
.navbar__burger-line.l2{ opacity:0; }
.navbar__burger-line.l3{ transform:translateY(-8px) rotate(-45deg); }
.navbar__mobile-menu{ overflow:hidden; max-height:0; opacity:0; transition:max-height .35s ease, opacity .3s ease; border-top:1px solid rgba(255,255,255,0.1); }
.navbar__mobile-menu.open{ max-height:320px; opacity:1; }
@media (min-width:768px){ .navbar__mobile-menu{ display:none; } }
.navbar__mobile-menu nav{ display:flex; flex-direction:column; padding:12px 20px; }
.navbar__mobile-link{ padding:12px 0; text-align:left; font-size:15px; font-weight:500; color:rgba(255,255,255,0.85); border-bottom:1px solid rgba(255,255,255,0.05); }
.navbar__mobile-link:last-child{ border-bottom:none; }
.navbar__mobile-link:hover{ color:#fff; }

/* ---------- TAG / BYLINE ---------- */
.tag{ display:inline-flex; align-items:center; padding:4px 10px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; color:#fff; }
.tag--lg{ padding:6px 14px; font-size:13px; }
.format-tag{ display:inline-flex; align-items:center; margin-left:6px; padding:4px 10px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink); background:#fff; border:1px solid rgba(0,0,0,0.25); }
.hero__inner .format-tag{ color:#fff; background:transparent; border-color:rgba(255,255,255,0.5); }
.byline{ display:flex; align-items:center; gap:8px; font-size:13px; color:rgba(0,0,0,0.55); flex-wrap:wrap; }
.byline--dark{ color:rgba(255,255,255,0.7); }
.byline__avatar{ display:flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:50%; font-size:11px; font-weight:700; background:var(--accent); color:var(--pitch); border:1px solid rgba(0,0,0,0.15); flex-shrink:0; }
.byline__name{ font-weight:500; color:rgba(0,0,0,0.8); }
.byline--dark .byline__name{ color:#fff; }

/* ---------- HERO ---------- */
.hero{ position:relative; display:block; width:100%; text-align:left; background:var(--pitch); overflow:hidden; }
.hero__media{ position:relative; width:100%; height:62vh; min-height:420px; max-height:720px; overflow:hidden; }
.hero__img{ width:100%; height:100%; object-fit:cover; opacity:0.92; transition:transform .5s cubic-bezier(.22,.61,.36,1); }
.hero:hover .hero__img{ transform:scale(1.04); }
.hero__overlay{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(27,6,7,0.15) 0%, rgba(27,6,7,0.4) 45%, rgba(15,3,4,0.96) 100%); }
.hero__content{ position:absolute; inset-inline:0; bottom:0; }
.hero__inner{ max-width:1280px; margin:0 auto; padding:0 20px 32px; max-width:760px; }
@media (min-width:640px){ .hero__inner{ padding:0 32px 48px; } }
.hero__title{ font-size:2.35rem; line-height:0.98; color:#fff; margin-top:16px; }
@media (min-width:640px){ .hero__title{ font-size:3.4rem; } }
@media (min-width:1024px){ .hero__title{ font-size:4.2rem; } }
.hero__excerpt{ max-width:560px; margin-top:16px; font-size:15px; line-height:1.6; color:rgba(255,255,255,0.75); }
@media (min-width:640px){ .hero__excerpt{ font-size:16px; } }
.hero__byline{ margin-top:20px; }

/* ---------- TRENDING ---------- */
.trending{ background:var(--ink); }
.trending__inner{ display:flex; flex-direction:column; gap:12px; padding:18px 20px; }
@media (min-width:768px){ .trending__inner{ flex-direction:row; align-items:center; gap:28px; padding:18px 32px; } }
.trending__label{ flex-shrink:0; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--accent); }
.trending__list{ display:flex; flex-direction:column; gap:6px; list-style:none; margin:0; padding:0; overflow-x:auto; }
@media (min-width:768px){ .trending__list{ flex-direction:row; align-items:center; gap:28px; } }
.trending__item{ flex-shrink:0; }
.trending__link{ display:flex; align-items:baseline; gap:8px; text-align:left; }
.trending__rank{ font-family:'Anton', sans-serif; font-size:14px; color:var(--accent); }
.trending__title{ font-size:13px; color:rgba(255,255,255,0.8); white-space:nowrap; }
@media (min-width:768px){ .trending__title{ white-space:normal; max-width:220px; } }
.trending__link:hover .trending__title{ color:#fff; }

/* ---------- LOAD MORE ---------- */
.load-more-wrap{ display:flex; justify-content:center; margin-top:36px; }
.load-more{ padding:12px 28px; font-size:14px; font-weight:600; color:#fff; background:var(--pitch); border:2px solid var(--pitch); transition:background .2s, color .2s; }
.load-more:hover{ background:transparent; color:var(--pitch); }

.no-results{ padding:40px 0; font-size:16px; color:rgba(0,0,0,0.55); }
.instagram-section .section__header{ border-color: var(--ink); }

/* ---------- LIVE NEWS (RSS) ---------- */
.live-news{ background:#fff; border-top:1px solid rgba(0,0,0,0.08); border-bottom:1px solid rgba(0,0,0,0.08); }
.live-news__inner{ padding:28px 20px; }
@media (min-width:640px){ .live-news__inner{ padding:32px 32px; } }
.live-news__header{ display:flex; align-items:center; gap:10px; margin-bottom:18px; }
.live-news__dot{ width:9px; height:9px; border-radius:50%; background:var(--live-red); animation:live-pulse 2s ease-in-out infinite; flex-shrink:0; }
@keyframes live-pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.35; } }
.live-news__title{ font-size:1.25rem; }
.live-news__status{ font-size:14px; color:rgba(0,0,0,0.5); }
.live-news__list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; }
.live-news__item{ border-bottom:1px solid rgba(0,0,0,0.08); }
.live-news__item:last-child{ border-bottom:none; }
.live-news__link{ display:flex; flex-direction:column; gap:4px; padding:14px 0; }
.live-news__headline{ font-size:15px; font-weight:600; color:var(--ink); line-height:1.35; }
.live-news__link:hover .live-news__headline{ text-decoration:underline; }
.live-news__excerpt{ font-size:13px; color:rgba(0,0,0,0.55); line-height:1.5; }
.live-news__source{ font-size:12px; font-weight:600; color:var(--live-red); text-transform:uppercase; letter-spacing:0.03em; margin-top:2px; }
.live-news--compact .live-news__inner{ padding-bottom:8px; }

/* ---------- NEWSLETTER ---------- */
.newsletter{ background:linear-gradient(135deg, var(--brand-red) 0%, var(--pitch) 65%); }
.newsletter__inner{ display:flex; flex-direction:column; gap:20px; padding:44px 20px; text-align:center; }
@media (min-width:768px){ .newsletter__inner{ flex-direction:row; align-items:center; justify-content:space-between; text-align:left; padding:44px 32px; } }
.newsletter__title{ font-size:1.5rem; color:#fff; }
.newsletter__subtitle{ margin-top:8px; max-width:420px; font-size:14px; color:rgba(255,255,255,0.65); }
.newsletter__form{ display:flex; flex-direction:column; gap:10px; width:100%; }
@media (min-width:480px){ .newsletter__form{ flex-direction:row; } }
@media (min-width:768px){ .newsletter__form{ width:auto; min-width:380px; } }
.newsletter__input{ flex:1; padding:12px 16px; font-size:15px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.25); color:#fff; }
.newsletter__input::placeholder{ color:rgba(255,255,255,0.45); }
.newsletter__input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
.newsletter__submit{ padding:12px 24px; font-size:14px; font-weight:600; color:var(--pitch); background:var(--accent); white-space:nowrap; transition:opacity .2s; }
.newsletter__submit:hover{ opacity:0.85; }
.newsletter__submit:disabled{ opacity:0.6; cursor:default; }
.newsletter__success{ font-size:15px; font-weight:500; color:var(--accent); }
.newsletter__error{ width:100%; margin-top:-8px; font-size:13px; color:#ff8080; }
@media (min-width:768px){ .newsletter__error{ text-align:right; } }

/* ---------- SECTIONS / GRID ---------- */
.section{ padding:48px 20px; }
.section__header{ display:flex; align-items:flex-end; justify-content:space-between; border-bottom:2px solid var(--ink); padding-bottom:12px; margin-bottom:32px; }
.section__title{ font-size:1.5rem; }
@media (min-width:640px){ .section__title{ font-size:1.875rem; } }

.grid-secondary{ display:grid; grid-template-columns:1fr; gap:24px 0; row-gap:40px; }
@media (min-width:640px){ .grid-secondary{ grid-template-columns:1fr 1fr; column-gap:24px; } }

.grid-related{ display:grid; grid-template-columns:1fr; gap:24px; margin-top:24px; }
@media (min-width:640px){ .grid-related{ grid-template-columns:repeat(3,1fr); } }

.card{ display:flex; flex-direction:column; text-align:left; }
@media (min-width:640px){ .card--large{ grid-column:span 2; grid-row:span 2; } }
.card__media{ position:relative; width:100%; overflow:hidden; aspect-ratio:4/3; }
.card__media--wide{ aspect-ratio:16/10; }
.card__img{ width:100%; height:100%; object-fit:cover; transition:transform .5s cubic-bezier(.22,.61,.36,1); }
.card:hover .card__img{ transform:scale(1.045); }
.card__tag{ position:absolute; top:0; left:0; }
.card__accent{ height:3px; width:100%; }
.card__body{ flex:1; display:flex; flex-direction:column; justify-content:space-between; background:#fff; padding:16px; }
.card__title{ font-size:1.125rem; line-height:1.05; }
.card__title--lg{ font-size:1.5rem; }
@media (min-width:640px){ .card__title--lg{ font-size:1.875rem; } }
.card__excerpt{ margin-top:12px; font-size:13px; color:rgba(0,0,0,0.6); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.card--large .card__excerpt{ font-size:15px; }
.card__byline{ margin-top:16px; }

/* ---------- POPULAR ---------- */
.popular-section{ background:var(--paper-2); }
.popular-row{ display:flex; align-items:center; gap:16px; width:100%; text-align:left; padding:16px 0; border-bottom:1px solid rgba(0,0,0,0.1); }
.popular-row:last-child{ border-bottom:none; }
@media (min-width:640px){ .popular-row{ gap:24px; } }
.popular-row__rank{ width:40px; flex-shrink:0; font-size:1.875rem; color:rgba(0,0,0,0.15); }
@media (min-width:640px){ .popular-row__rank{ width:56px; font-size:2.25rem; } }
.popular-row__thumb{ width:64px; height:64px; flex-shrink:0; overflow:hidden; }
@media (min-width:640px){ .popular-row__thumb{ width:80px; height:80px; } }
.popular-row__thumb img{ width:100%; height:100%; object-fit:cover; }
.popular-row__text{ min-width:0; flex:1; }
.popular-row__cat{ font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; }
.popular-row__title{ margin-top:2px; font-size:1rem; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
@media (min-width:640px){ .popular-row__title{ font-size:1.125rem; } }

/* ---------- FOOTER ---------- */
.footer{ background:linear-gradient(160deg, var(--brand-red) 0%, var(--pitch) 55%); color:rgba(255,255,255,0.7); }
.footer__inner{ display:flex; flex-direction:column; gap:32px; padding:48px 20px 0; }
@media (min-width:640px){ .footer__inner{ flex-direction:row; align-items:flex-start; justify-content:space-between; padding:48px 32px 0; } }
.footer__logo{ display:flex; align-items:center; gap:2px; }
.footer__logo .navbar__logo-foot, .footer__logo .navbar__logo-culture{ font-size:1.25rem; }
.footer__tagline{ margin-top:12px; max-width:280px; font-size:14px; color:rgba(255,255,255,0.55); }
.footer__meta-links{ display:flex; gap:16px; margin-top:14px; }
.footer__meta-link{ font-size:13px; color:rgba(255,255,255,0.55); text-decoration:underline; text-underline-offset:2px; }
.footer__meta-link:hover{ color:#fff; }
.footer__nav{ display:flex; flex-wrap:wrap; gap:12px 32px; }
.footer__link{ font-size:14px; color:rgba(255,255,255,0.7); }
.footer__link:hover{ color:#fff; }
.footer__social{ display:flex; gap:12px; }
.footer__social-icon{ display:flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:50%; border:1px solid rgba(255,255,255,0.2); font-size:11px; font-weight:600; }
.footer__bottom{ display:flex; flex-direction:column; gap:8px; border-top:1px solid rgba(255,255,255,0.1); margin-top:40px; padding:24px 20px; font-size:12px; color:rgba(255,255,255,0.45); }
@media (min-width:640px){ .footer__bottom{ flex-direction:row; align-items:center; justify-content:space-between; padding:24px 32px; } }

/* ---------- CATEGORY HEADER ---------- */
.category-header{ padding-top:40px; }
.back-link{ font-size:14px; font-weight:500; color:rgba(0,0,0,0.5); }
.back-link:hover{ color:#000; }
.category-header__row{ display:flex; align-items:center; gap:12px; border-bottom:2px solid var(--ink); padding-bottom:16px; margin-top:12px; }
.category-header__title{ font-size:1.875rem; }
@media (min-width:640px){ .category-header__title{ font-size:2.25rem; } }

/* ---------- ARTICLE PAGE ---------- */
.article-top{ max-width:768px; padding-top:32px; }
@media (min-width:640px){ .article-top{ padding-top:48px; } }
.article-tag{ margin-top:20px; }
.article-title{ margin-top:16px; font-size:2.1rem; line-height:1.02; }
@media (min-width:640px){ .article-title{ font-size:2.8rem; } }
@media (min-width:1024px){ .article-title{ font-size:3.4rem; } }
.article-meta{ display:flex; align-items:center; justify-content:space-between; border-top:1px solid rgba(0,0,0,0.1); border-bottom:1px solid rgba(0,0,0,0.1); padding:16px 0; margin-top:24px; }
.article-hero-wrap{ max-width:1024px; margin-top:32px; }
.article-hero{ width:100%; aspect-ratio:16/9; overflow:hidden; }
.article-hero img{ width:100%; height:100%; object-fit:cover; }
.article-body{ max-width:680px; padding:40px 20px; }
@media (min-width:640px){ .article-body{ padding:40px 32px; } }
.article-body p{ margin-top:24px; font-size:17px; line-height:1.75; color:rgba(0,0,0,0.8); }
.article-body p:first-child{ margin-top:0; }

/* ---------- CONTACT FORM ---------- */
.contact-form-wrap{ margin-top:32px; }
.contact-form{ display:flex; flex-direction:column; gap:6px; }
.contact-form__label{ font-size:13px; font-weight:600; color:rgba(0,0,0,0.7); margin-top:14px; }
.contact-form__label:first-child{ margin-top:0; }
.contact-form__input, .contact-form__textarea{ padding:12px 14px; font-size:15px; font-family:inherit; background:#fff; border:1px solid rgba(0,0,0,0.2); color:var(--ink); }
.contact-form__textarea{ resize:vertical; }
.contact-form__input:focus, .contact-form__textarea:focus{ outline:2px solid var(--pitch); outline-offset:1px; }
.contact-form__submit{ align-self:flex-start; margin-top:18px; padding:12px 28px; font-size:14px; font-weight:600; color:#fff; background:var(--pitch); border:2px solid var(--pitch); transition:background .2s, color .2s; }
.contact-form__submit:hover{ background:transparent; color:var(--pitch); }
.contact-form__submit:disabled{ opacity:0.6; cursor:default; }
.contact-form__error{ margin-top:10px; font-size:13px; color:var(--live-red); }
.contact-form__success{ margin-top:24px; font-size:16px; font-weight:500; color:var(--pitch); }

/* ---------- WHATSAPP CTA ---------- */
.whatsapp-cta{ display:flex; align-items:center; gap:14px; margin-top:40px; padding:16px 20px; background:#f0faf3; border:1px solid #25d36633; }
.whatsapp-cta__icon{ display:flex; align-items:center; justify-content:center; width:44px; height:44px; flex-shrink:0; border-radius:50%; background:#25D366; color:#fff; }
.whatsapp-cta__text{ font-size:14px; line-height:1.5; color:rgba(0,0,0,0.75); }
.whatsapp-cta__text strong{ color:#128C4A; }
.whatsapp-cta:hover{ background:#e6f7ea; }
.drop-cap:first-letter{ font-family:'Anton', sans-serif; float:left; font-size:4.2rem; line-height:0.82; padding-right:8px; padding-top:4px; color:var(--pitch); }
.article-quote{ margin:36px 0; padding-left:20px; border-left:4px solid var(--brand-red); font-size:1.25rem; font-weight:500; line-height:1.3; color:rgba(0,0,0,0.9); }
@media (min-width:640px){ .article-quote{ font-size:1.5rem; } }

.app-shell{ min-height:100vh; background:var(--paper); }

@media (prefers-reduced-motion: reduce){
  html{ scroll-behavior:auto; }
  *{ transition-duration:0.01ms !important; animation-duration:0.01ms !important; }
}

</style>
